## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
spring.datasource.url=jdbc:mysql://localhost:3306/oauthData?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

## Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
jpa.hibernate.show-sql=true
jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.hibernate=INFO

# JWT Secret Key
jwt.secret-key=secretKey

# AES
aes.password = password_test
aes.salt = salt_test
# 16 bytes
aes.iv-text= ivText_test_1234

#openapi
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.version=OPENAPI_3_0
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enable=true
springdoc.swagger-ui.url=/v3/api-docs

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=your_secure_password